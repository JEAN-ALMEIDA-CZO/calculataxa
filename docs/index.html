<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Taxa de Serviço</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <h1>Calculadora de Taxa de Serviço</h1>
    <form id="service-form">
      <label for="total">Valor da Conta (R$):</label>
      <input type="number" id="total" placeholder="Ex: 150.00" step="0.01" required>

      <label for="taxa">Taxa de Serviço (%):</label>
      <input type="number" id="taxa" placeholder="Ex: 10" value="10" required>

      <button type="submit">Calcular</button>
    </form>

    <div class="resultado" id="resultado" style="display: none;">
      <p>🧾 Valor da Taxa: <strong id="valorTaxa"></strong></p>
      <p>💰 Total com Taxa: <strong id="valorTotal"></strong></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
